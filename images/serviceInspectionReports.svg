<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" role="img" aria-labelledby="inspectionReportTitle">
  <title id="inspectionReportTitle">Illustration of a color-mapped inspection report document</title>
  <defs>
    <linearGradient id="irBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2f5" />
      <stop offset="100%" stop-color="#dde5ea" />
    </linearGradient>
    <radialGradient id="irBlob" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e2372c" />
      <stop offset="28%" stop-color="#fe6911" />
      <stop offset="52%" stop-color="#ffd23f" />
      <stop offset="72%" stop-color="#4fb5e1" />
      <stop offset="100%" stop-color="#184762" />
    </radialGradient>
  </defs>

  <rect width="800" height="610" fill="url(#irBg)" />

  <!-- Drop shadow -->
  <rect x="128" y="58" width="500" height="500" rx="14" fill="#0f2a3a" fill-opacity="0.10" />

  <!-- Report sheet -->
  <rect x="112" y="42" width="500" height="500" rx="14" fill="#ffffff" stroke="#d7dee3" stroke-width="2" />

  <!-- Header bar -->
  <rect x="112" y="42" width="500" height="58" rx="14" fill="#184762" />
  <rect x="112" y="82" width="500" height="18" fill="#184762" />
  <rect x="140" y="60" width="180" height="12" rx="6" fill="#ffffff" fill-opacity="0.9" />
  <rect x="140" y="78" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.55" />
  <rect x="520" y="58" width="68" height="24" rx="12" fill="#fe6911" />
  <text x="554" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">PASS</text>

  <!-- Deviation color map -->
  <g transform="translate(255,275)">
    <ellipse rx="130" ry="110" fill="url(#irBlob)" />
    <ellipse rx="130" ry="110" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5" />
    <!-- contour rings -->
    <ellipse rx="95" ry="80" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />
    <ellipse rx="58" ry="48" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />
    <ellipse rx="24" ry="20" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
  </g>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#4f4f4f">
    <rect x="420" y="200" width="14" height="14" rx="3" fill="#e2372c" />
    <text x="440" y="211">+0.10 mm</text>
    <rect x="420" y="222" width="14" height="14" rx="3" fill="#fe6911" />
    <text x="440" y="233">+0.05 mm</text>
    <rect x="420" y="244" width="14" height="14" rx="3" fill="#ffd23f" />
    <text x="440" y="255">0.00 mm</text>
    <rect x="420" y="266" width="14" height="14" rx="3" fill="#4fb5e1" />
    <text x="440" y="277">-0.05 mm</text>
    <rect x="420" y="288" width="14" height="14" rx="3" fill="#184762" />
    <text x="440" y="299">-0.10 mm</text>
  </g>

  <!-- Table rows -->
  <g>
    <line x1="140" y1="410" x2="588" y2="410" stroke="#e5e9ec" stroke-width="1.5" />
    <circle cx="148" cy="430" r="4" fill="#fe6911" />
    <rect x="162" y="425" width="220" height="9" rx="4.5" fill="#c9d1d6" />
    <rect x="500" y="425" width="70" height="9" rx="4.5" fill="#c9d1d6" />

    <circle cx="148" cy="454" r="4" fill="#4fb5e1" />
    <rect x="162" y="449" width="260" height="9" rx="4.5" fill="#c9d1d6" />
    <rect x="500" y="449" width="70" height="9" rx="4.5" fill="#c9d1d6" />

    <circle cx="148" cy="478" r="4" fill="#184762" />
    <rect x="162" y="473" width="190" height="9" rx="4.5" fill="#c9d1d6" />
    <rect x="500" y="473" width="70" height="9" rx="4.5" fill="#c9d1d6" />

    <circle cx="148" cy="502" r="4" fill="#ffd23f" />
    <rect x="162" y="497" width="240" height="9" rx="4.5" fill="#c9d1d6" />
    <rect x="500" y="497" width="70" height="9" rx="4.5" fill="#c9d1d6" />
  </g>

  <!-- Verified badge -->
  <circle cx="600" cy="500" r="34" fill="#ffffff" stroke="#fe6911" stroke-width="4" />
  <path d="M586 500l10 10 18-20" fill="none" stroke="#fe6911" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
